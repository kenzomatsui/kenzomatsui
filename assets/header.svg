<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sérgio Kenzo Matsui Carnelós</title>
  <desc id="desc">Aplicativos, educação, jogos e robótica. Um pequeno robô pisca enquanto sinais luminosos percorrem um circuito conectado a um celular.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2c4050"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e2b"/><stop offset="1" stop-color="#182d39"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#b8e477"/><stop offset="1" stop-color="#6edbd2"/></linearGradient>
  </defs>
  <style>
    .gamepad{animation:drift 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes drift{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
    .signal{stroke-dasharray:14 210;animation:flow 5s linear infinite}
    .signal2{stroke-dasharray:10 300;animation:flow2 7s linear infinite}
    .eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s ease-in-out infinite}
    .antenna{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
    .star{transform-box:fill-box;transform-origin:center;animation:twinkle 5s ease-in-out infinite}
    .delayed{animation-delay:-2.5s}
    .cursor{animation:cursor 2s steps(1) infinite}
    @keyframes flow{to{stroke-dashoffset:-224}}
    @keyframes flow2{to{stroke-dashoffset:-310}}
    @keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.12)}}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:.9;transform:scale(1.2)}}
    @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes cursor{0%,65%{opacity:1}66%,100%{opacity:.2}}
    @media(prefers-reduced-motion:reduce){.signal,.signal2,.eyes,.antenna,.star,.cursor,.gamepad{animation:none}}
  </style>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#grid)"/>
  <path d="M36 397H1164" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="68" fill="#b8e477" font-size="15" letter-spacing="3">KENZOMATSUI / LAB DE PROJETOS</text>
    <text x="60" y="151" fill="#f2efe6" font-size="57" font-weight="700">Sérgio Kenzo</text>
    <text x="60" y="216" fill="#f2efe6" font-size="57" font-weight="700">Matsui Carnelós</text>
    <text x="64" y="267" fill="#bac8d3" font-size="22">Aplicativos, educação, jogos e robótica.</text>
    <rect x="63" y="302" width="555" height="46" rx="10" fill="#0d1923" stroke="#324652"/>
    <text x="80" y="331" fill="#6edbd2" font-size="16" font-family="monospace">&gt; Kotlin · Java · TypeScript · C#</text>
    <rect class="cursor" x="588" y="317" width="9" height="17" rx="1" fill="#b8e477"/>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M809 250v53h110l37-37h72M865 161h53l39 39h55" stroke="#3c625e"/>
    <path class="signal" d="M809 250v53h110l37-37h72" stroke="#6edbd2"/>
    <path class="signal2" d="M865 161h53l39 39h55" stroke="#b8e477"/>
    <path d="M728 315v-76l-25-25v-86h36" stroke="#3c625e"/>
    <path class="signal2" d="M728 315v-76l-25-25v-86h36" stroke="#6edbd2"/>
    <g stroke="#b8e477">
      <rect x="757" y="75" width="108" height="175" rx="17" fill="#172b39"/>
      <path d="M790 91h42M796 233h28M779 123h64M779 142h39M779 182l16-17 17 15 28-29"/>
      <rect x="970" y="104" width="158" height="119" rx="24" fill="#172b39"/>
      <path d="M1049 104V80M1018 187q31 16 62 0M986 223v19M1112 223v19"/>
      <circle cx="1049" cy="68" r="9" fill="#b8e477"/>
      <circle class="antenna" cx="1049" cy="68" r="20" stroke="#6edbd2" stroke-width="2"/>
      <g class="eyes"><circle cx="1016" cy="150" r="8" fill="#b8e477"/><circle cx="1083" cy="150" r="8" fill="#b8e477"/></g>
      <circle cx="1028" cy="266" r="7" fill="#172b39"/>
      <circle cx="728" cy="322" r="7" fill="#172b39"/>
    </g>
    <g stroke="#6edbd2" stroke-width="2">
      <path class="star" d="M921 72v14M914 79h14"/>
      <path class="star delayed" d="M1109 303v18M1100 312h18"/>
      <path class="star" d="M867 343v12M861 349h12"/>
    </g>
  </g>
  <g transform="translate(921 323)"><g class="gamepad" fill="#172b39" stroke="#6edbd2" stroke-width="2" stroke-linecap="round"><path d="M3 5q0-5 6-5h33q6 0 7 6l4 13q1 8-6 8l-10-8H17L8 27q-7 1-7-7Z"/><path d="M11 9h10m-5-5v10"/><circle cx="37" cy="7" r="2" fill="#b8e477"/><circle cx="43" cy="13" r="2" fill="#b8e477"/></g></g>
  <text x="789" y="367" fill="#a9bfc6" font-size="12" letter-spacing="3" font-family="Arial, Helvetica, sans-serif">IDEIAS EM MOVIMENTO</text>
</svg>
